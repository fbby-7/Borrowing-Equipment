
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d14">
  <title>Forgot Password | Fullbright College</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #080d14;
      --panel: #101b26;
      --field: #09121b;
      --line: #26394b;
      --text: #e8eef6;
      --muted: #91a4b6;
      --accent: #28b6eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 15% 5%, #122b3c 0, transparent 35%),
        var(--bg);
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
    }

    .wrap {
      width: min(100%, 460px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      background: white;
    }

    .brand h1 {
      font-size: 21px;
      margin: 0 0 5px;
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .card {
      background: linear-gradient(145deg, #111e2a, #0d151f);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 24px 70px #0007;
    }

    h2 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin: 0 0 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #b8c7d5;
    }

    input {
      width: 100%;
      padding: 15px;
      background: var(--field);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      font: inherit;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #28b6eb25;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 1px solid #31506a;
      border-radius: 12px;
      background: linear-gradient(100deg, #71d1f4, #28b6eb);
      color: #06111b;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: #172737;
      color: var(--text);
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      display: none;
      padding: 13px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #0d352e;
      color: #a7f3d0;
    }

    .status.error {
      background: #7f1d1d;
      color: #fee2e2;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #8cccf0;
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    [hidden] {
      display: none !important;
    }

    .footer {
      text-align: center;
      color: #667d90;
      font-size: 12px;
      margin-top: 18px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <div class="brand">
      <img
        class="logo"
        src="assets/fullbright-logo.jpg"
        alt="Fullbright College logo"
      >

      <div>
        <h1>Fullbright College</h1>
        <p>Equipment Borrowing System</p>
      </div>
    </div>

    <section class="card">
      <h2 id="heading">Forgot your password?</h2>

      <p class="description" id="description">
        Enter the email address associated with your account. We'll send you a password reset link. Open the link in your email to choose a new password.
      </p>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <form id="requestForm">
        <div class="field">
          <label for="email">Account email</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <button id="requestBtn" type="submit">Send password reset link</button>
      </form>

      <a class="back" href="./index.html">
        Return to sign in
      </a>
    </section>

    <p class="footer">
      
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://uaxfzmtpjcfwfoqhgfih.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_hsippBvYrIczvzTtI8cR2A_dV6eqcUj";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("requestForm");
    const emailInput = document.getElementById("email");
    const button = document.getElementById("requestBtn");
    const statusEl = document.getElementById("status");

    function showMessage(text, isError = false) {
      statusEl.textContent = text;
      statusEl.className = "status show " + (isError ? "error" : "success");
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const email = emailInput.value.trim();
      if (!email) {
        showMessage("Enter your account email first.", true);
        return;
      }

      button.disabled = true;
      button.textContent = "Sending reset link...";
      try {
        const redirectTo = `${window.location.origin}/reset-password.html`;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
        if (error) {
          showMessage(error.message || "Could not send the reset link. Please try again.", true);
          return;
        }
        showMessage("If an account exists for this email, a password reset link has been sent. Check your inbox and spam folder, then open the link to choose a new password.");
      } catch (error) {
        showMessage(error?.message || "Could not send the reset link. Please try again.", true);
      } finally {
        button.disabled = false;
        button.textContent = "Send password reset link";
      }
    });
  </script>
</body>
</html>
